# Publish server.json to the official MCP Registry on every change.
# Auth = GitHub OIDC of this repo (no account, no key): mcp-publisher --signaloidc
# requires the server.json "name" to match this repo's owner/repo.
name: Publish MCP server.json

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://raw.githubusercontent.com/modelcontextprotocol/registry/main/scripts/install-mcp-publisher.sh" | bash
          if [ -f ./mcp-publisher ]; then sudo mv ./mcp-publisher /usr/local/bin/mcp-publisher; fi
          chmod +x /usr/local/bin/mcp-publisher 2>/dev/null || true
          mcp-publisher --version

      - name: Publish to registry
        run: mcp-publisher publish --signaloidc
