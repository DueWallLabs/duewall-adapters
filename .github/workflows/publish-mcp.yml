# Publish server.json to the official MCP Registry on every change.
# Auth = GitHub OIDC of this repo (no account, no key): mcp-publisher --signaloidc
# requires the server.json "name" to match this repo's owner/repo (lowercase).
name: Publish MCP server.json

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "mcp-publisher version: $VER"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${VER}/mcp-publisher_linux_amd64.tar.gz" -o mp.tgz
          tar -xzf mp.tgz
          sudo install -m 755 ./mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Publish to registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
