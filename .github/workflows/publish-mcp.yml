# Publish server.json to the official MCP Registry on every change.
# Auth = GitHub OIDC of this repo (no account, no key):
#   mcp-publisher login github-oidc && mcp-publisher publish
# On failure the captured output is committed as pub.log so it is readable
# without repository admin access.
name: Publish MCP server.json

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          # 不走 api.github.com（Actions 共享 IP 未认证限额 60/h，曾被限流打挂）——
          # 用 releases/latest/download 稳定重定向 + 3 次重试
          for i in 1 2 3; do
            curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mp.tgz && break
            echo "download retry $i"; sleep 10
          done
          tar -xzf mp.tgz
          sudo install -m 755 ./mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Publish to registry
        id: pub
        continue-on-error: true
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          mcp-publisher login github-oidc 2>&1 | tee pub.log
          mcp-publisher publish 2>&1 | tee -a pub.log

      - name: Commit log on failure
        if: steps.pub.outcome == 'failure'
        run: |
          git config user.email "actions@duewall.com"
          git config user.name "duewall-actions"
          git add pub.log
          git commit -m "ci: publish failure log [skip serverjson]"
          git push

      - name: Fail the job if publish failed
        if: steps.pub.outcome == 'failure'
        run: exit 1
